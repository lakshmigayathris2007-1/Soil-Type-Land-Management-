# ──────────────────────────────────────────────────────────────
# Soil Type & Land Usage Management System — application.properties
# ──────────────────────────────────────────────────────────────

spring.application.name=soil-management-system

# ── Server ──────────────────────────────────────────────────
server.port=8080

# ── H2 In-Memory Database (development / demo) ───────────────
spring.datasource.url=jdbc:h2:mem:soildb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ── JPA / Hibernate ──────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ── MySQL (comment-out H2 block and uncomment below for production) ─
# spring.datasource.url=jdbc:mysql://localhost:3306/soilmanagement?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# spring.jpa.hibernate.ddl-auto=update

# ── Logging ──────────────────────────────────────────────────
logging.level.com.soilmanagement=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
